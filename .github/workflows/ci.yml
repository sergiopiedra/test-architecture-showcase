name: CI

# The pipeline mirrors the test pyramid: cheap, fast checks gate the expensive ones,
# so a typo fails in under a minute and never waits for a browser to boot.
#
#   static ─► unit ─┬─► mutation
#                   ├─► integration ─┐
#                   └─► contract ────┴─► e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unit:
    name: Unit & property tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  mutation:
    name: Mutation testing (domain)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - name: Mutation score summary
        if: always()
        run: npx tsx scripts/ci-summary.ts mutation >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  integration:
    name: Integration (Postgres via Testcontainers) + coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runs unit + integration together so coverage reflects both, and enforces the thresholds.
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: npx tsx scripts/ci-summary.ts coverage >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 14

  contract:
    name: Contract tests (Pact)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Consumer tests (write the pact)
        run: npm run test:contract:consumer
      - name: Provider verification (replay the pact)
        run: npm run test:contract:provider
      - uses: actions/upload-artifact@v7
        with:
          name: pacts
          path: pacts/
          retention-days: 14

  e2e:
    name: E2E (Playwright, UI + API)
    needs: [integration, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
