version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns:
          ['vitest', '@vitest/*', '@playwright/test', '@stryker-mutator/*', '@pact-foundation/*']
      lint:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier']
    ignore:
      # Keep @types/node on the same major as the Node version in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
